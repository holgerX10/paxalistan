<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110E" media="(prefers-color-scheme: dark)">
<meta name="text-scale" content="scale">
<title>PaxaListan</title>
<meta name="description" content="Önskelistan där ingen ger samma present två gånger. Ingen reklam, ingen spårning, inget konto.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --spring:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1.004 83.8%,1);
 --soft:cubic-bezier(.2,.8,.2,1);
 --t-spring:.6s;--t-soft:.42s;--t-fx:.2s;--t-fast:.12s;
 --bg:#F6EFE4;--bg2:#EDE3D3;--bg3:#DCCDB6;--card:#FFFCF7;--glass:rgba(246,239,228,.84);
 --ink:#1E1613;--ink2:#6B5A4D;--ink3:#A08E7E;
 --act:#E8502F;--act2:#FFD9CE;--on-act:#FFF8F3;
 --pax:#1F6E6B;--pax2:#CFE7E3;--on-pax:#F2FBF9;
 --pris:#F0B340;--pris2:#FBE7B8;--on-pris:#2A1C08;
 --sh:0 1px 2px rgba(30,22,19,.06),0 14px 36px -14px rgba(30,22,19,.28);
 --sh2:0 2px 4px rgba(30,22,19,.08),0 24px 48px -16px rgba(30,22,19,.4);
 --r:28px;--r2:20px;--r3:14px;
 --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
 --hdr:60px;--nav:86px;
 color-scheme:light;
}
html.dark{
 --bg:#17110E;--bg2:#241B16;--bg3:#3A2D25;--card:#201813;--glass:rgba(23,17,14,.84);
 --ink:#F6EFE4;--ink2:#C4B3A2;--ink3:#8A796A;
 --act:#FF6A47;--act2:#5B2415;--on-act:#1E0C06;
 --pax:#5FC2BB;--pax2:#153B39;--on-pax:#06201E;
 --pris:#F5C462;--pris2:#4A3410;--on-pris:#1E1405;
 --sh:0 1px 2px rgba(0,0,0,.3),0 14px 36px -14px rgba(0,0,0,.7);
 --sh2:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.8);
 color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html.big{font-size:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
.app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);isolation:isolate;overflow:clip}
@media(min-width:560px){.app{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px -30px rgba(0,0,0,.4)}}
.lbl{font:700 11px 'Space Mono';text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.mono{font-family:'Space Mono',monospace}
.press{transition:transform var(--t-spring) var(--spring),box-shadow var(--t-fx),background var(--t-fx),filter var(--t-fx)}
.press:active{transform:scale(.94);transition-duration:var(--t-fast);transition-timing-function:ease-out}
.btn{min-height:56px;padding:0 20px;font-family:Anton;font-size:21px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:999px;position:relative;overflow:hidden}
.btn.act{background:var(--act);color:var(--on-act);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--act) 70%,transparent)}
.btn.pax{background:var(--pax);color:var(--on-pax);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--pax) 70%,transparent)}
.btn.ghost{background:var(--card);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 14%,transparent)}
.btn.sm{min-height:48px;font-size:17px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);pointer-events:none;animation:rip .55s var(--soft) forwards}
@keyframes rip{to{transform:scale(2.8);opacity:0}}

/* huvud */
.hdr{position:absolute;top:0;left:0;right:0;height:calc(var(--hdr) + var(--sat));z-index:29;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:var(--sat) 14px 0 18px;border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.compact{border-color:color-mix(in srgb,var(--ink) 10%,transparent)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;min-height:44px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--act);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--act) 80%,transparent)}
.logo i svg{width:18px;height:18px;color:var(--on-act)}
.logo b{font-family:Anton;font-weight:400;font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.logo b span{color:var(--act)}
.switch{display:flex;align-items:center;gap:6px;min-height:44px;max-width:52%;padding:0 10px 0 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font:600 13px 'Archivo'}
.switch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch svg{width:16px;height:16px;flex:none;color:var(--ink2)}
.switch.nolist{background:var(--act);color:var(--on-act)}

.vw{position:absolute;inset:0 0 calc(var(--nav) + var(--sab)) 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:calc(var(--hdr) + var(--sat));opacity:0;pointer-events:none;transform:translateX(var(--dx,0)) scale(.98);transition:opacity .25s,transform var(--t-soft) var(--soft)}
.vw::-webkit-scrollbar{display:none}
.vw.on{opacity:1;pointer-events:auto;transform:none}
.vw.out{--dx:calc(-24% * var(--dir,1))}
.vw.in{--dx:calc(60% * var(--dir,1))}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;gap:10px}
.top h3{font-family:Anton;font-weight:400;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.chip{font:700 12px 'Space Mono';background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:999px;text-transform:uppercase;display:inline-flex;gap:4px;white-space:nowrap}
.note-pill{margin:12px 20px 0;padding:10px 14px;border-radius:999px;font:700 11px 'Space Mono';text-transform:uppercase;text-align:center;background:var(--pris);color:var(--on-pris)}

/* hjälte */
.hero{margin:12px 16px 0;background:var(--pax);color:var(--on-pax);padding:18px 20px 16px;position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.hero .row{display:flex;justify-content:space-between;color:var(--on-pax);opacity:.8;font:700 11px 'Space Mono';text-transform:uppercase;letter-spacing:.06em}
.hero h2{font-family:Anton;font-weight:400;font-size:var(--hs,52px);line-height:.9;text-transform:uppercase;margin-top:10px;letter-spacing:.01em;padding-right:88px;white-space:nowrap}
.hero h2 span{color:transparent;-webkit-text-stroke:1.5px var(--pris)}
.hero .m{font-size:14px;margin-top:8px;opacity:.9}
.sticker{position:absolute;right:16px;top:38px;width:76px;height:76px;border-radius:50%;background:var(--pris);color:var(--on-pris);display:flex;align-items:center;justify-content:center;text-align:center;font:700 10px 'Space Mono';line-height:1.1;text-transform:uppercase;transform:rotate(10deg);box-shadow:0 8px 18px -6px rgba(0,0,0,.35);animation:wob 5s ease-in-out infinite}
.sticker b{display:block;font-family:Anton;font-weight:400;font-size:28px;line-height:1}
@keyframes wob{50%{transform:rotate(2deg) translateY(-3px)}}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--on-pax);transition:width var(--t-spring) var(--spring);position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.pn{display:flex;justify-content:space-between;margin-top:8px;font:700 11px 'Space Mono';text-transform:uppercase;letter-spacing:.06em;opacity:.9}

/* segment */
.seg{position:relative;display:flex;margin:16px 20px 0;background:var(--bg2);border-radius:999px;padding:4px}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;background:var(--ink);transition:transform var(--t-spring) var(--spring),width var(--t-spring) var(--spring);box-shadow:var(--sh)}
.seg button{flex:1;min-height:46px;font:700 12px 'Space Mono';text-transform:uppercase;border-radius:999px;position:relative;z-index:1;color:var(--ink2);transition:color var(--t-fx)}
.seg button.on{color:var(--bg)}
.seg button em{font-style:normal;opacity:.7}

/* rutnät */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:14px 20px 26px}
.card{position:relative;height:224px;border-radius:var(--r2);overflow:hidden;background:var(--bg2);box-shadow:var(--sh);opacity:0;transform:translateY(40px) scale(.96);transition:opacity var(--t-soft),transform var(--t-spring) var(--spring),box-shadow var(--t-fx)}
.card.in{opacity:1;transform:none}
.card:active{transform:scale(.97);transition-duration:var(--t-fast)}
.card.gone{opacity:0;transform:scale(.8);pointer-events:none}
.card>.open{position:absolute;inset:0;width:100%;height:100%;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--soft)}
.card:hover img{transform:scale(1.06)}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,rgba(30,22,19,.6));pointer-events:none}
.card.noimg::after{display:none}
.card.noimg .name{color:var(--ink);text-shadow:none}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;pointer-events:none;z-index:2}
.tag{font:700 10px 'Space Mono';text-transform:uppercase;background:var(--card);color:var(--ink);padding:4px 8px;border-radius:999px;box-shadow:var(--sh)}
.tag.drop{background:var(--pris);color:var(--on-pris)}
.tag.prio{background:var(--ink);color:var(--bg)}
.tag.ex{background:var(--bg3)}
.tag.q{background:var(--pris);color:var(--on-pris)}
.tag.paxt{background:var(--pax);color:var(--on-pax)}
.lab{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;pointer-events:none;z-index:2}
.name{color:#fff;min-width:0;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.name b{display:block;font-family:Anton;font-weight:400;font-size:18px;line-height:1.02;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto}
.card.narrow .name b{font-size:16px}
.card.narrow .paxb{width:44px;height:44px}
.card.narrow .paxb svg{width:20px;height:20px}
.name span{font:11px 'Space Mono';display:block;margin-top:3px;opacity:.9}
.paxb{pointer-events:auto;flex:none;width:50px;height:50px;border-radius:50%;background:var(--card);color:var(--act);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh2);position:relative}
.paxb svg{width:22px;height:22px;transition:transform var(--t-spring) var(--spring)}
.paxb::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pax);opacity:0}
.card.mine .paxb{background:var(--pax);color:var(--on-pax)}
.card.mine .paxb svg{transform:rotate(360deg)}
.card.mine.just .paxb::after{animation:ring .7s var(--soft)}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.stamp{position:absolute;right:10px;top:12px;z-index:2;font-family:Anton;font-size:22px;color:var(--pax);border:3px solid var(--pax);border-radius:8px;padding:0 8px;transform:rotate(-12deg) scale(3);opacity:0;pointer-events:none;background:color-mix(in srgb,var(--card) 90%,transparent);transition:transform var(--t-soft) var(--spring),opacity var(--t-fx);text-transform:uppercase}
.card.mine .stamp,.card.taken .stamp{transform:rotate(-12deg) scale(1);opacity:1}
.card.taken img{filter:saturate(.3)}
.card.taken .paxb{display:none}
.empty{grid-column:span 12;border-radius:var(--r2);border:2px dashed var(--bg3);padding:28px 18px;text-align:center;color:var(--ink2)}
.empty b{font-family:Anton;font-weight:400;font-size:26px;text-transform:uppercase;display:block;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:16px}
.hint{margin:0 20px 20px;padding:12px 16px;border-radius:var(--r2);background:var(--bg2);font-size:13px;color:var(--ink2);text-align:center}

/* start utan lista */
.start{padding:30px 24px 40px}
.start h2{font-family:Anton;font-weight:400;font-size:46px;line-height:.92;text-transform:uppercase;margin:8px 0 12px}
.start h2 span{color:var(--act)}
.start p{font-size:16px;line-height:1.5;color:var(--ink2);max-width:34ch}
.start .btn{margin-top:22px}
.start ul{list-style:none;margin:26px 0 0}
.start li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--bg3);font-size:15px;line-height:1.4}
.start li b{font-family:Anton;font-weight:400;font-size:22px;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pax);color:var(--on-pax);flex:none}

/* meny */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:start;padding:8px 6px var(--sab);z-index:20}
.nav .mark{position:absolute;top:6px;left:0;width:64px;height:54px;border-radius:18px;background:color-mix(in srgb,var(--ink) 8%,transparent);transition:transform var(--t-spring) var(--spring);pointer-events:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 10px 'Space Mono';text-transform:uppercase;color:var(--ink3);text-decoration:none;min-height:54px;justify-content:center;position:relative;cursor:pointer;z-index:1;transition:color var(--t-fx)}
.nav a svg{width:24px;height:24px;transition:transform var(--t-spring) var(--spring)}
.nav a.on{color:var(--ink)}
.nav a.on svg{transform:translateY(-1px) scale(1.12)}
.nav a:active svg{transform:scale(.85)}
.nav .badge[hidden]{display:none!important}
.nav .badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--act);color:var(--on-act);font-size:10px;display:flex;align-items:center;justify-content:center;animation:pop .6s var(--spring)}
@keyframes pop{from{transform:scale(0)}}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.fab{margin-top:-34px;justify-self:center;width:78px;height:78px;border-radius:50%;background:var(--act);color:var(--on-act);box-shadow:0 14px 30px -8px color-mix(in srgb,var(--act) 80%,transparent),0 0 0 6px var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px 'Space Mono';text-transform:uppercase;position:relative;z-index:2}
.fab svg{width:26px;height:26px}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--act);animation:puls 2.4s ease-out infinite;z-index:-1}
@keyframes puls{to{transform:scale(1.55);opacity:0}}

/* kortlek */
.deckwrap{position:relative;height:min(430px,56vh);margin:6px 20px 0}
.dk{position:absolute;inset:0;border-radius:var(--r);background:var(--card);box-shadow:var(--sh2);touch-action:none;user-select:none;transition:transform var(--t-spring) var(--spring),opacity .3s;perspective:1200px;transform:translateY(var(--y,0)) scale(var(--s,1)) rotate(var(--rot,0deg))}
.dk.c2{--y:14px;--s:.95;--rot:2deg}
.dk.c3{--y:28px;--s:.9;--rot:-2deg}
.dk .face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .7s var(--spring);display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
.dk .back{transform:rotateY(180deg);background:var(--ink);color:var(--bg);padding:22px;overflow-y:auto}
.dk .back a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--pris);text-decoration:none;font:700 12px 'Space Mono';text-transform:uppercase}
.dk.flip .front{transform:rotateY(-180deg)}
.dk.flip .back{transform:rotateY(0)}
.dk .front img,.dk .front .ph{width:100%;flex:1;object-fit:cover;min-height:0;background:var(--bg2)}
.dk .front .ph{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.dk .front .t{padding:14px 18px 18px;background:var(--card)}
.dk .front .t b{font-family:Anton;font-weight:400;font-size:30px;line-height:1;text-transform:uppercase;display:block;margin-top:4px}
.dk .st{position:absolute;top:24px;font-family:Anton;font-size:36px;padding:2px 14px;border:4px solid;border-radius:10px;opacity:0;z-index:3;text-transform:uppercase;background:var(--card)}
.dk .st.y{left:20px;color:var(--pax);transform:rotate(-12deg)}
.dk .st.n{right:20px;color:var(--ink2);transform:rotate(12deg)}
.shop{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--bg) 25%,transparent);font-size:16px;gap:10px}
.shop b{font:700 15px 'Space Mono';font-variant-numeric:tabular-nums;white-space:nowrap}
.dacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:22px 20px 20px}
.dacts .btn{font-size:18px;min-height:56px;padding:0 6px}
.done{border-radius:var(--r);margin:6px 20px;padding:34px 18px;text-align:center;background:var(--pax2);animation:slin .8s var(--spring)}
.done b{font-family:Anton;font-weight:400;font-size:44px;line-height:1;display:block;text-transform:uppercase}
@keyframes slin{from{transform:translateY(-40px) scale(.6) rotate(-8deg);opacity:0}}

/* aktivitet */
.feed{padding:0 20px 20px}
.ev{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bg3);opacity:0;transform:translateX(-16px);animation:evin .6s var(--spring) forwards}
@keyframes evin{to{opacity:1;transform:none}}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:18px;box-shadow:var(--sh);background:var(--pax2);color:var(--ink)}
.ev p{font-size:15px;line-height:1.3;flex:1;min-width:0}
.ev p b{font-weight:700}
.ev small{display:block;font:11px 'Space Mono';color:var(--ink2);margin-top:2px}
.ev img{width:46px;height:46px;object-fit:cover;border-radius:12px;flex:none;box-shadow:var(--sh)}

/* mer */
.grp{margin:0 20px 16px;border-radius:var(--r2);background:var(--card);box-shadow:var(--sh);overflow:hidden}
.grp h4{font:700 11px 'Space Mono';text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 6px;color:var(--ink2)}
.it{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;width:100%;text-align:left;font-size:16px;transition:background var(--t-fx)}
.it:active{background:var(--bg2)}
.it .r{margin-left:auto;font:700 12px 'Space Mono';color:var(--ink2);white-space:nowrap}
.it.cur{background:var(--pax2)}
.it .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--pax)}
.sw2{margin-left:auto;width:54px;height:32px;border-radius:999px;background:var(--bg3);position:relative;flex:none;transition:background var(--t-fx)}

/* ===================== api ===================== */
async function rpc(fn,args){const r=await fetch(SUPA+'/rest/v1/rpc/paxa_'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(args||{})});
 if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}const e=new Error(m||('HTTP '+r.status));e.code=m;throw e}
 const t=await r.text();return t?JSON.parse(t):null}
const ERR={not_allowed:'Du får inte göra det här.',not_found:'Hittades inte.',list_full:'Listan är full.',name_required:'Skriv ett namn.',thumb_too_big:'Bilden blev för stor.',taken:'Någon hann före.'};
const errTx=e=>ERR[(e&&e.code)||'']||'Kunde inte spara. Försök igen.';
async function load(silent){if(!token)return;try{const d=await rpc('get_list',{p_token:token});
 if(!d){S.err='missing';S.loaded=true;render();return}
 S.list=d.list;S.role=d.role;S.tokens=d.tokens;S.items=d.items||[];S.pax=d.pax||[];const newEv=(d.events||[]);if(S.loaded&&newEv.length&&S.events.length&&newEv[0].id!==S.events[0].id&&cur!=='akt'){$('badge').hidden=false;$('badge').textContent='•'}S.events=newEv;S.err=null;S.loaded=true;remember();render();}
 catch(e){if(!silent)toast('Kunde inte nå servern');S.loaded=true;S.err=S.list?null:'net';render()}}
function startSync(){stopSync();if(!token||!S.list)return;
 pollT=setInterval(()=>{if(document.visibilityState==='visible')load(true)},8000);
 if(sb){try{chan=sb.channel('paxa-'+S.list.id);chan.on('broadcast',{event:'change'},()=>load(true)).subscribe()}catch(e){chan=null}}}
function stopSync(){clearInterval(pollT);pollT=null;if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}}
function ping(){if(chan){try{chan.send({type:'broadcast',event:'change',payload:{}})}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&token)load(true)});
(function loadSb(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=()=>{try{sb=window.supabase.createClient(SUPA,KEY,{realtime:{params:{eventsPerSecond:2}}});if(S.list)startSync()}catch(e){}};document.head.appendChild(s)})();

/* ===================== routing ===================== */
function parseHash(){const h=location.hash.match(/^#list-([A-Za-z0-9]+)/);return h?h[1]:null}
async function route(){const t=parseHash();
 if(t&&t!==token){token=t;S.loaded=false;S.list=null;S.err=null;deckIdx=0;stopSync();render();await load();startSync()}
 else if(!t){const last=mine()[0];if(last){location.replace('#list-'+last.token);return}token=null;S.list=null;S.loaded=true;stopSync();render()}
 const q=new URLSearchParams(location.search);if(q.get('url')||q.get('text')||q.get('title')){const v=q.get('url')||q.get('text')||q.get('title');history.replaceState(null,'',location.pathname+location.hash);setTimeout(()=>{if(S.list)openAdd(v)},600)}}
addEventListener('hashchange',route);

let rafR=null;

 $('switch').hidden=!L&&!mine().length;$('switch').classList.toggle('nolist',!L);$('switchTx').textContent=L?L.name:'Välj lista';

function daysLeft(d){if(!d)return null;const t=new Date(d+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400e3)}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'})}catch(e){return d}}
function splitName(n){const p=(n||'Listan').trim().split(/\s+/);if(p.length===1)return[p[0],''];return[p.slice(0,-1).join(' '),p[p.length-1]]}
function fitTitle(el,maxPx,pad){if(!el)return;const lines=[...el.childNodes].map(x=>x.textContent||'').join('\n').split('\n').filter(Boolean);const L=Math.max(1,...lines.map(x=>x.length));const w=(el.parentElement.clientWidth||320)-pad;el.style.setProperty('--hs',Math.max(26,Math.min(maxPx,w/(L*.5)))+'px')}

 if(S.err==='net'&&!L){w.innerHTML=`<div class="start"><div class="lbl">Ingen kontakt</div><h2>Kunde inte<br>hämta listan</h2><p>Kolla nätet och försök igen.</p><button class="btn ghost press" id="retry">Försök igen</button></div>`;$('retry').onclick=()=>{S.loaded=false;render();load()};return}
 const items=S.items.filter(i=>!hidden.has(i.id));const tot=items.length,done=items.filter(i=>paxOf(i.id)).length;const dl=daysLeft(L.date);const [a,b]=splitName(L.name);
 const all=listItems();const ex=!items.length;
 const list=all.filter(i=>filter==='alla'||(filter==='lediga'?!paxOf(i.id):!!paxOf(i.id)));
 w.innerHTML=`${S.role==='recipient'?'<div class="note-pill">Din lista. Släkten ser vad som är paxat, inte du.</div>':''}
 <div class="hero" id="hero"><div class="row"><span>${esc(L.occasion||'Önskelista')}</span><span>${L.date?fmtDate(L.date):''}</span></div>
 <h2>${esc(a)}<br><span>${esc(b)}</span></h2><div class="m">${L.kid?esc(L.recipient||'Mottagaren')+' ser inte vem som har paxat.':'Alla ser vad som är paxat.'}</div>
 ${dl!=null?`<div class="sticker"><div><b>${dl<0?0:dl}</b>${dl===1?'dag':'dagar'}<br>kvar</div></div>`:''}
 <div class="bar onlypax"><i style="width:${tot?done/tot*100:0}%"></i></div>
 <div class="pn onlypax"><span>${done} av ${tot} paxade</span><span>${tot-done} lediga</span></div></div>
 ${items.length?`<div class="seg onlypax" id="seg" role="tablist"><span class="pill" id="pill"></span>${['alla','lediga','paxade'].map(f=>{const n={alla:items.length,lediga:items.filter(i=>!paxOf(i.id)).length,paxade:items.filter(i=>paxOf(i.id)).length}[f];return `<button role="tab" class="${f===filter?'on':''}" data-f="${f}">${f} <em>${n}</em></button>`}).join('')}</div>`:''}
 <div class="grid" id="grid">${list.length?list.map((it,i)=>{const row=Math.floor(i/2),f=i%2===0;let span=(row%2===0)===f?5:7;if(i===list.length-1&&f)span=12;return card(it,span)}).join(''):`<div class="empty"><b>${filter==='paxade'?'Inget paxat än':'Allt är paxat'}</b>${filter==='paxade'?'Välj något i listan och tryck på paketet.':'Släkten har tagit allt. Bra jobbat!'}</div>`}</div>
 ${ex?`<div class="hint">Två exempel, så du ser hur det blir. De försvinner när du lagt till något eget.</div>`:''}`;
 fitTitle(w.querySelector('h2'),56,128);
 const seg=$('seg');if(seg){seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;buzz();renderLista()};requestAnimationFrame(movePill)}
 wireGrid(true);
}
function startHtml(){const my=mine();return `<div class="start"><div class="lbl">Önskelistan där ingen ger samma present två gånger</div><h2>Paxa.<br><span>Klart.</span></h2>

let io;
function wireGrid(animate){const g=$('grid');if(!g)return;if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{root:$('v-lista'),threshold:.1});
 [...g.querySelectorAll('.card')].forEach((el,i)=>{const fresh=!seen.has(el.dataset.u);seen.add(el.dataset.u);el.style.transitionDelay=(fresh?i*60:0)+'ms';if(RM||!fresh)el.classList.add('in');else io.observe(el)});
 g.onclick=e=>{const c=e.target.closest('.card');if(!c)return;const u=c.dataset.u;if(e.target.closest('.paxb'))togglePax(u,e.target.closest('.paxb'));else detail(u,c.querySelector('img'))}}

 return{url:u.href,shop:shop.charAt(0).toUpperCase()+shop.slice(1),name:name?name.charAt(0).toUpperCase()+name.slice(1):''}}catch(e){return null}}

function resetCam(){camBlob=null;camBusy=false;$('vf').classList.remove('lock');$('hit').classList.remove('on');$('vfImg').removeAttribute('src');$('vfImg').style.opacity=0;$('say').textContent='Ta en bild av saken';$('shutter').style.display=''}

async function gotFile(f){if(!f)return;$('camIn').value='';$('pickIn').value='';try{camBlob=await resize(f,1280,.86)}catch(e){camBlob=f}
 $('vfImg').src=URL.createObjectURL(camBlob);$('vfImg').style.opacity=1;setTimeout(recognize,250)}
function loadImg(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob)})}
async function resize(blob,max,q,box){const im=await loadImg(blob);let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;
 if(box){const bx=Math.max(0,Math.min(95,+box.x||0))/100,by=Math.max(0,Math.min(95,+box.y||0))/100,bw=Math.max(.2,Math.min(1,(+box.w||100)/100)),bh=Math.max(.2,Math.min(1,(+box.h||100)/100));
  const pad=.06;sx=Math.max(0,(bx-pad)*sw);sy=Math.max(0,(by-pad)*sh);sw=Math.min(im.naturalWidth-sx,(bw+2*pad)*im.naturalWidth);sh=Math.min(im.naturalHeight-sy,(bh+2*pad)*im.naturalHeight)}
 const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q))}
const toDataUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
function seeFail(d,st){const m={no_key:'Bildigenkänningen saknar nyckel.',timeout:'Igenkänningen tog för lång tid.',net:'Ingen kontakt med igenkänningen.'}[d&&d.error]||('Igenkänningen svarade inte'+(d&&d.detail?': '+String(d.detail).slice(0,80):st?' ('+st+')':'')+'.');console.warn('see',st,d);setTimeout(()=>toast(m),700)}
async function recognize(){if(camBusy||!camBlob)return;camBusy=true;buzz(20);$('vf').classList.add('lock');$('shutter').style.display='none';$('say').textContent='Känner igen…';
 let g=null;
 try{const small=await resize(camBlob,900,.8);const b64=(await toDataUrl(small)).split(',')[1];
  const r=await fetch('/api/see',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,media_type:'image/jpeg'}),signal:AbortSignal.timeout(25000)});
  const d=await r.json().catch(()=>({}));if(r.ok&&!d.error)g=d;else seeFail(d,r.status)}catch(e){seeFail({error:e.name==='TimeoutError'?'timeout':'net'},0)}
 if(g&&g.name){$('hit').classList.add('on');$('say').textContent='Det ser ut som '+String(g.name).toLowerCase();buzz()}else $('say').textContent='Skriv vad det är';
 setTimeout(()=>result(g),g?600:200)}
async function result(g){
 const names=g&&g.name?[String(g.name),...(Array.isArray(g.alts)?g.alts.slice(0,2).map(String):[])]:[];let pick=names[0]||'';
 const box=g&&g.box&&isFinite(+g.box.w)&&+g.box.w>10?g.box:null;
 let thumbBlob;try{thumbBlob=await resize(camBlob,560,.78,box)}catch(e){thumbBlob=camBlob}
 let thumb=await toDataUrl(thumbBlob);if(thumb.length>110000){try{thumb=await toDataUrl(await resize(camBlob,420,.7,box))}catch(e){}}
 $('cam').classList.remove('on');
 openSheet(`<span class="lbl">${names.length?'Det ser ut som':'Vad är det?'}</span>
 <img class="big-img" src="${thumb}" alt="">
 ${names.length?`<div class="guess" id="guess">${names.map((n,i)=>`<button class="${i?'':'on'}">${esc(n)}</button>`).join('')}<button>Annat…</button></div>`:''}
 <div id="resForm" ${names.length?'hidden':''}><label class="field"><span>Namn</span><input id="rName" value="${esc(pick)}" placeholder="Vad är det?"></label></div>
 <div class="row2"><label class="field"><span>Pris (kr)</span><input id="rPrice" inputmode="decimal" value="${g&&g.price!=null?+g.price:''}" placeholder="Tomt om du inte vet"></label><label class="field"><span>Butik</span><input id="rShop" value="${esc(g&&g.shop||'')}" placeholder="Valfritt"></label></div>
 <button class="more" id="rMore">Anteckning och viktig ${CHEV}</button>
 <div class="fold" id="rFold"><div><label class="field"><span>Anteckning till givaren</span><input id="rNote" placeholder="Storlek, färg eller modell"></label><div class="prow"><button class="chipb" id="rPrio">☆ Viktig</button></div></div></div>
 <button class="btn act press" id="rAdd">${GIFT}<span>Lägg i listan</span></button>`);
 let prio=false;
 if($('guess'))$('guess').onclick=e=>{const b=e.target.closest('button');if(!b)return;buzz();[...$('guess').children].forEach(x=>x.classList.toggle('on',x===b));

 $('rPrio').onclick=()=>{prio=!prio;buzz();$('rPrio').textContent=(prio?'★':'☆')+' Viktig';$('rPrio').classList.toggle('on',prio)};
 $('rAdd').onclick=()=>{const name=($('resForm').hidden?pick:$('rName').value.trim());if(!name){$('resForm').hidden=false;$('rName').focus();return}
  const pr=$('rPrice').value.replace(/[^\d.,]/g,'').replace(',','.');
  const item={name,price:pr?parseFloat(pr):null,shop:$('rShop').value.trim()||null,note:$('rNote').value.trim()||null,cat:g&&CATS.includes(g.cat)?g.cat:'Annat',prio};withName(()=>addItem(item,thumb,null))}}

 if($('leaveList'))$('leaveList').onclick=()=>{forget(L.id);stopSync();token=null;S.list=null;location.hash='';route()}}
async function share(kind,base){const L=S.list;let url,text;
 if(kind==='owner'){url=base+'#list-'+S.tokens.owner;try{await navigator.clipboard.writeText(url);toast('Din länk är kopierad. Spara den på ett säkert ställe.')}catch(e){toast('Kunde inte kopiera')}return}
 if(kind==='guest'){url=base+'#list-'+S.tokens.guest;text=`Hej! Här är ${L.name}. Öppna länken, välj något och tryck Paxa, så vet alla att det är taget. ${L.kid?(L.recipient||'Mottagaren')+' ser inte vem som paxat. ':''}Inget konto behövs.\n${url}`}
 else if(kind==='view'){url=base+'#list-'+S.tokens.view;text=`Här är din önskelista, ${L.recipient||''}! Lägg till det du önskar dig.\n${url}`}
 else{url=location.href;text=`${L.name}\n${url}`}
 buzz(16);if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text);toast('Meddelandet är kopierat')}catch(e){openSheet(`<span class="lbl">Kopiera</span><h5>Meddelande</h5><div class="note" style="user-select:all">${esc(text)}</div>`)}}

/* ===================== kortlek ===================== */
function deck(){const L=S.list;if(!L){$('deckArea').innerHTML=`<div class="empty" style="margin:0 20px"><b>Ingen lista vald</b></div>`;$('dkN').textContent='';return}
 const free=S.items.filter(i=>!paxOf(i.id)&&!hidden.has(i.id));$('dkN').textContent=free.length+' lediga';
 if(!canPax()){$('deckArea').innerHTML=`<div class="done"><b>Bara att titta</b><p style="margin:10px 0 0">Bläddra är för den som ska ge något. Du ser listan i första fliken.</p></div>`;return}
 const left=free.slice(deckIdx);
 if(!free.length){$('deckArea').innerHTML=`<div class="done"><b>${S.items.length?'Allt paxat!':'Tomt här'}</b><p style="margin:10px 0 18px">${S.items.length?'Det finns inget ledigt att bläddra bland.':'Lägg till saker i listan, så dyker de upp här som kort.'}</p><button class="btn ghost press" id="dkAdd">${CAM}<span>Lägg till</span></button></div>`;$('dkAdd').onclick=()=>openAdd();return}
 if(!left.length){$('deckArea').innerHTML=`<div class="done"><b>Klart!</b><p style="margin:10px 0 18px">Du har sett alla lediga saker.</p><button class="btn ghost press" id="dkAgain">Börja om</button></div>`;$('dkAgain').onclick=()=>{deckIdx=0;deck()};return}
 const stack=left.slice(0,3);
 $('deckArea').innerHTML=`<div class="deckwrap" id="dw">${stack.map((it,k)=>`<div class="dk c${k+1}" style="z-index:${10-k}" data-u="${it.id}">
  <div class="st y">Paxa</div><div class="st n">Nästa</div>
  <div class="face front">${it.thumb?`<img src="${esc(it.img||it.thumb)}" alt="${esc(it.name)}">`:`<div class="ph">${PHOTO}</div>`}<div class="t"><span class="lbl">${it.prio?'★ Viktig · ':''}${it.shop?esc(it.shop)+' · ':''}${kr(it.price)}</span><b>${esc(it.name)}</b></div></div>
  <div class="face back"><span class="lbl" style="color:var(--pris)">Mer om</span><div style="font-family:Anton;font-size:30px;text-transform:uppercase;margin:6px 0 10px">${esc(it.name)}</div><div class="shop"><span>${esc(it.shop||'Butik ej angiven')}</span><b>${kr(it.price)}</b></div>${it.note?`<p style="margin-top:14px;font-size:15px;opacity:.85">${esc(it.note)}</p>`:''}${it.url?`<p style="margin-top:14px"><a href="${esc(it.url)}" target="_blank" rel="noopener">Öppna länken</a></p>`:''}</div>
 </div>`).reverse().join('')}</div>
 <div class="dacts"><button class="btn ghost press" id="dkNo">Nästa</button><button class="btn ghost press" id="dkFlip">Vänd</button><button class="btn act press" id="dkYes">Paxa</button></div>`;
 const top=$('dw').querySelector('.c1');let x0=null,dx=0,moved=false,t0=0;
 const sy=top.querySelector('.st.y'),sn=top.querySelector('.st.n');const under=[...$('dw').querySelectorAll('.dk:not(.c1)')];
 top.onpointerdown=e=>{if(e.target.closest('a'))return;x0=e.clientX;t0=performance.now();moved=false;top.setPointerCapture(e.pointerId);top.style.transition='none';under.forEach(u=>u.style.transition='none')};
 top.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;top.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`;sy.style.opacity=Math.max(0,dx/80);sn.style.opacity=Math.max(0,-dx/80);
  const k=Math.min(1,Math.abs(dx)/160);under.forEach((u,i)=>{const y=14*(i+1)-14*k,s=.95-.05*i+.05*k;u.style.transform=`translateY(${y}px) scale(${s}) rotate(${(i?-2:2)*(1-k)}deg)`})};
 top.onpointerup=()=>{if(x0===null)return;const v=dx/(performance.now()-t0);x0=null;top.style.transition='';under.forEach(u=>{u.style.transition='';u.style.transform=''});
  if(Math.abs(dx)>100||Math.abs(v)>.5)fling(Math.sign(dx||v));else{top.style.transform='';sy.style.opacity=sn.style.opacity=0;if(!moved)top.classList.toggle('flip')}dx=0};
 $('dkNo').onclick=()=>fling(-1);$('dkYes').onclick=()=>fling(1);$('dkFlip').onclick=()=>top.classList.toggle('flip');
 function fling(d){const it=findItem(top.dataset.u);
  if(d>0&&!me.name){askName(()=>fling(1));return}
  if(d>0&&firstPax){vows(it.id,$('dkYes'));$('vYes').onclick=()=>{firstPax=false;ls.set('pl-vows',true);closeSheet();setTimeout(()=>fling(1),350)};return}
  top.style.transition='transform .45s cubic-bezier(.4,0,1,1),opacity .4s';top.style.transform=`translateX(${d*150}%) rotate(${d*28}deg)`;top.style.opacity=0;buzz(14);
  if(d>0)doPax(it,$('dkYes'));else deckIdx++;
  setTimeout(deck,320)}}

/* ===================== aktivitet ===================== */
function renderFeed(){const list=S.events||[];$('aktN').textContent=list.length?'Senaste':'';
 if(!S.list){$('feed').innerHTML=`<div class="empty"><b>Ingen lista vald</b></div>`;return}
 if(!list.length){$('feed').innerHTML=`<div class="empty"><b>Inget har hänt än</b>Dela listan med släkten, så syns här vem som gjort vad.${isOwner()?`<button class="btn ghost press" id="aktInv">Dela listan</button>`:''}</div>`;const b=$('aktInv');if(b)b.onclick=()=>show('mer');return}
 const mask=kid||S.role==='recipient';
 $('feed').innerHTML=list.map((e,i)=>{const secret=e.t==='secret'||(mask&&['pax','unpax','st'].includes(e.t));const who=nameOf(e.by,e.by_name);
  const txt=secret?'gjorde något hemligt':e.t==='pax'?`paxade <b>${esc(e.name)}</b>`:e.t==='unpax'?`ångrade paxningen av <b>${esc(e.name)}</b>`:e.t==='add'?`lade till <b>${esc(e.name)}</b>`:e.t==='st'?`markerade <b>${esc(e.name)}</b> som ${esc(e.extra||'')}`:e.t==='del'?`tog bort <b>${esc(e.name)}</b>`:esc(e.name||'');
  return `<div class="ev" style="animation-delay:${Math.min(i,8)*50}ms"><span class="av">${esc((who||'?')[0])}</span><p><b>${esc(who)}</b> ${txt}<small>${ago(e.at)}</small></p>${e.thumb&&!secret?`<img src="${esc(e.thumb)}" alt="">`:''}</div>`}).join('')}
function ago(t){if(!t)return'';const d=Date.now()-t;if(d<60e3)return'nyss';if(d<3600e3)return Math.round(d/60e3)+' min';if(d<86400e3)return Math.round(d/3600e3)+' tim';return Math.round(d/86400e3)+' d'}

/* ===================== vyer, ark ===================== */
function moveMark(){const a=document.querySelector('.nav a.on');if(!a)return;const r=a.getBoundingClientRect(),n=$('nav').getBoundingClientRect();$('mark').style.transform=`translateX(${r.left-n.left+r.width/2-32}px)`}
function show(v){if(v===cur)return;const dir=ORDER.indexOf(v)>ORDER.indexOf(cur)?1:-1;const o=$('v-'+cur),n=$('v-'+v);
 o.style.setProperty('--dir',dir);n.style.setProperty('--dir',dir);o.classList.add('out');o.classList.remove('on');n.classList.add('in');void n.offsetWidth;n.classList.remove('in');n.classList.add('on');
 setTimeout(()=>o.classList.remove('out'),450);cur=v;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));moveMark();
 $('hdr').classList.toggle('compact',v!=='lista'||$('v-lista').scrollTop>40);
 if(v==='kort')deck();if(v==='akt'){renderFeed();$('badge').hidden=true}if(v==='lista')wireGrid(true);if(v==='mer')renderMer()}
$('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a){buzz();show(a.dataset.v)}});
$('v-lista').addEventListener('scroll',()=>{const y=$('v-lista').scrollTop;$('hdr').classList.toggle('compact',y>40);const h=$('hero');if(h){if(!RM)h.style.transform=`translateY(${Math.min(y,200)*.25}px)`;h.style.opacity=Math.max(0,1-y/260)}},{passive:true});
$('fab').onclick=()=>openAdd();
app.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.fab');if(!b||RM)return;const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height);const i=document.createElement('i');i.className='ripple';i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(i);setTimeout(()=>i.remove(),600)});
/* Bilden följer arket bild för bild, så de rör sig som en enhet */
function glide(c,from,getTo,ms,done){const p=app.getBoundingClientRect();const t0=performance.now();let last=null,still=0;
 const ease=t=>1-Math.pow(1-t,4);
 const step=now=>{const t=Math.min(1,(now-t0)/ms),k=ease(t);const to=getTo();
  const x=from.left+(to.left-from.left)*k,y=from.top+(to.top-from.top)*k,w=from.width+(to.width-from.width)*k,h=from.height+(to.height-from.height)*k;
  c.style.left=x-p.left+'px';c.style.top=y-p.top+'px';c.style.width=w+'px';c.style.height=h+'px';c.style.borderRadius=(from.r+(to.r-from.r)*k)+'px';
  const key=Math.round(to.top)+','+Math.round(to.left);still=key===last?still+1:0;last=key;
  if(t<1||(still<3&&now-t0<ms+900))requestAnimationFrame(step);else done()};
 requestAnimationFrame(step)}
function rr(el){const r=el.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height,r:parseFloat(getComputedStyle(el).borderTopLeftRadius)||0}}
function openSheet(h,img){const sh=$('sheet');$('sheetIn').innerHTML=h;sh.scrollTop=0;$('scrim').classList.add('on');sh.classList.remove('drag');sh.style.transform='';fromImg=null;wireForm();
 const hero=$('heroImg');
 if(img&&hero&&hero.tagName==='IMG'&&!RM){fromImg=img;const from=rr(img);
  const c=document.createElement('img');c.className='clone';c.src=img.src;app.appendChild(c);
  hero.style.visibility='hidden';img.style.visibility='hidden';
  glide(c,from,()=>rr(hero),520,()=>{hero.style.visibility='';c.remove();img.style.visibility=''})}
 requestAnimationFrame(()=>sh.classList.add('on'))}
function closeSheet(){const sh=$('sheet');$('scrim').classList.remove('on');const hero=$('heroImg');
 if(fromImg&&hero&&hero.tagName==='IMG'&&!RM&&fromImg.isConnected){const p=app.getBoundingClientRect(),tr=fromImg.getBoundingClientRect();
  if(tr.top>p.top+40&&tr.bottom<p.bottom-80){const src=fromImg,from=rr(hero);const c=document.createElement('img');c.className='clone';c.src=hero.src;app.appendChild(c);
   hero.style.visibility='hidden';src.style.visibility='hidden';
   glide(c,from,()=>rr(src),420,()=>{src.style.visibility='';c.remove()})}}
 fromImg=null;sh.classList.remove('on');sh.style.transform=''}
$('scrim').onclick=closeSheet;$('sheetX').onclick=closeSheet;
(()=>{const sh=$('sheet'),g=$('grab');let y0=null,dy=0,t0=0;
 g.onpointerdown=e=>{y0=e.clientY;t0=performance.now();g.setPointerCapture(e.pointerId);sh.classList.add('drag')};
 g.onpointermove=e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`;$('scrim').style.opacity=1-dy/400};
 g.onpointerup=()=>{if(y0===null)return;const v=dy/(performance.now()-t0);y0=null;sh.classList.remove('drag');$('scrim').style.opacity='';if(dy>140||v>.6)closeSheet();else sh.style.transform='';dy=0}})();
if(ls.get('pl-big'))document.documentElement.classList.add('big');
if(ls.get('pl-dark',null)===true||(ls.get('pl-dark',null)===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');

/* ===================== konfetti, toast ===================== */
const cv=$('conf'),cx2=cv.getContext('2d');let parts=[],raf=null;
function sizeCanvas(){const r=app.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;cx2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function burst(el){if(RM||!el)return;sizeCanvas();const p=app.getBoundingClientRect(),r=el.getBoundingClientRect();const x=r.left-p.left+r.width/2,y=r.top-p.top+r.height/2;const cols=['#E8502F','#1F6E6B','#F0B340','#FFD9CE','#5FC2BB'];
 for(let k=0;k<26;k++){const a=-Math.PI/2+(Math.random()-.5)*1.6,v=4+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[k%5],r:Math.random()*360,vr:(Math.random()-.5)*20,w:5+Math.random()*5,h:3+Math.random()*4,l:1,round:k%3===0})}
 if(!raf)raf=requestAnimationFrame(tickConf)}
function tickConf(){cx2.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.014;cx2.save();cx2.globalAlpha=Math.max(0,Math.min(1,p.l*2));cx2.translate(p.x,p.y);cx2.rotate(p.r*Math.PI/180);cx2.fillStyle=p.c;if(p.round){cx2.beginPath();cx2.arc(0,0,p.w/2,0,7);cx2.fill()}else cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx2.restore()});if(parts.length)raf=requestAnimationFrame(tickConf);else{raf=null;cx2.clearRect(0,0,cv.width,cv.height)}}
let tt,undoFn;
function toast(t,fn,dur=3400){$('toastTx').textContent=t;undoFn=fn;$('undo').style.display=fn?'':'none';const el=$('toast');el.style.setProperty('--tdur',dur+'ms');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),dur)}
$('undo').onclick=()=>{const f=undoFn;undoFn=null;$('toast').classList.remove('on');f&&f()};

/* ===================== start ===================== */
requestAnimationFrame(moveMark);addEventListener('resize',()=>{moveMark();movePill();fitTitle($('listaIn').querySelector('h2'),56,128)});
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
route();
</script>
